.yt-player-wrap {

  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: var(--radius-md);
  overflow: hidden;
  margin: 18px 0 12px;
  box-shadow: var(--shadow-md);
}
.yt-player-wrap iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  display: none;
}
.yt-player-wrap.is-playing iframe { display: block; }
.yt-poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  background: #000;
  cursor: pointer;
}
.yt-poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.92;
}
.yt-poster-play {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(15,15,25,0.2);
}
.yt-poster-play .play-circle {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: rgba(20,20,30,0.72);
  display: flex;
  align-items: center;
  justify-content: center;
}
.yt-poster-play svg { width: 24px; height: 24px; }
.yt-player-wrap.is-playing .yt-poster { display: none; }
.yt-external { margin: 0 0 10px; }

<script>
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id'), 10);
  let video = null;
  let navPrev = null;
  let navNext = null;
  let playerStarted = false;

  function escapeHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  }

  function embedSrc(videoId, autoplay) {
    if (window.YoutubeUtils && window.YoutubeUtils.embedUrl) {
      return window.YoutubeUtils.embedUrl(videoId, { autoplay: !!autoplay });
    }
    var q = 'playsinline=1&rel=0&modestbranding=1';
    if (autoplay) q += '&autoplay=1';
    return 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(videoId) + '?' + q;
  }

  function startPlayer() {
    if (!video || !video.videoId || playerStarted) return;
    playerStarted = true;
    var wrap = document.getElementById('ytPlayerWrap');
    var iframe = document.getElementById('ytPlayer');
    if (!wrap || !iframe) return;
    wrap.classList.add('is-playing');
    iframe.src = embedSrc(video.videoId, true);
    iframe.title = video.title;
  }

  function mountPlayerPoster() {
    var wrap = document.getElementById('ytPlayerWrap');
    var iframe = document.getElementById('ytPlayer');
    if (!wrap || !iframe || !video) return;
    playerStarted = false;
    wrap.classList.remove('is-playing');
    iframe.removeAttribute('src');

    var thumb = video.thumb || (window.YoutubeUtils && window.YoutubeUtils.getThumbUrl(video.videoId, 'hqdefault'));
    var poster = document.getElementById('ytPoster');
    if (!poster) {
      poster = document.createElement('button');
      poster.type = 'button';
      poster.id = 'ytPoster';
      poster.className = 'yt-poster';
      poster.setAttribute('aria-label', '영상 재생');
      wrap.insertBefore(poster, iframe);
      poster.addEventListener('click', startPlayer);
    }
    poster.innerHTML = (thumb
      ? '<img src="' + escapeHtml(thumb) + '" alt="">'
      : '<div style="position:absolute;inset:0;background:#111;"></div>') +
      '<span class="yt-poster-play"><span class="play-circle">' +
      '<svg viewBox="0 0 24 24" fill="#fff"><polygon points="6 4 20 12 6 20 6 4"/></svg>' +
      '</span></span>';
  }

  function render() {
    if (!video || !video.videoId) {
      document.querySelector('main .wrap').innerHTML = `
        <div style="text-align:center; padding:80px 0;">
          <p style="font-size:14px; color:var(--ink-500); margin-bottom:16px;">해당 영상을 찾을 수 없습니다.</p>
          <a href="/reviews-youtube" class="btn-outline">목록으로</a>
        </div>`;
      return;
    }

    document.title = video.title + ' | 퍼플오토 유튜브';
    document.getElementById('crumbTitle').textContent = video.title;
    document.getElementById('postTitle').textContent = video.title;
    document.getElementById('postDate').textContent = video.date || '';
    document.getElementById('postDuration').textContent = video.duration ? ('재생 ' + video.duration) : '';
    document.getElementById('dotDuration').style.display = video.duration ? '' : 'none';

    mountPlayerPoster();

    var descEl = document.getElementById('postDesc');
    descEl.textContent = video.desc || '';

    var extEl = document.getElementById('ytExternal');
    if (video.url) {
      extEl.innerHTML = '<a href="' + escapeHtml(video.url) + '" target="_blank" rel="noopener noreferrer">유튜브 앱/사이트에서 보기</a>';
    } else {
      extEl.innerHTML = '';
    }

    var ogImg = video.thumb || (window.YoutubeUtils && window.YoutubeUtils.getThumbUrl(video.videoId, 'maxresdefault'));
    if (ogImg) {
      var m = document.querySelector('meta[property="og:image"]');
      if (m) m.setAttribute('content', ogImg);
    }

    var prevRow = document.getElementById('navPrev');
    var nextRow = document.getElementById('navNext');
    if (navPrev && navPrev.id) {
      prevRow.href = '/youtube-detail?id=' + navPrev.id;
      document.getElementById('navPrevTitle').textContent = navPrev.title;
      prevRow.classList.remove('disabled');
    } else {
      prevRow.classList.add('disabled');
      prevRow.removeAttribute('href');
      document.getElementById('navPrevTitle').textContent = '이전 영상이 없습니다';
    }
    if (navNext && navNext.id) {
      nextRow.href = '/youtube-detail?id=' + navNext.id;
      document.getElementById('navNextTitle').textContent = navNext.title;
      nextRow.classList.remove('disabled');
    } else {
      nextRow.classList.add('disabled');
      nextRow.removeAttribute('href');
      document.getElementById('navNextTitle').textContent = '다음 영상이 없습니다';
    }
  }

  async function bootstrap() {
    if (!id) {
      video = null;
      render();
      return;
    }
    if (window.PurpleLeaseData && window.PurpleLeaseData.isConfigured()) {
      try {
        var pack = await window.PurpleLeaseData.fetchYoutubeDetailWithNav(id);
        if (pack && pack.detail) {
          video = pack.detail;
          navPrev = pack.prev;
          navNext = pack.next;
        }
      } catch (err) {
        console.warn('[PurpleLease] youtube detail load failed:', err);
      }
    }
    render();
  }

  bootstrap();
</script>
