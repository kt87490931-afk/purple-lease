# purple-inquiry-telegram — 견적문의 텔레그램 알림 웹훅
location = /api/webhook/inquiry-telegram {
    proxy_pass http://127.0.0.1:8793;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Webhook-Secret $http_x_webhook_secret;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 30s;
    proxy_connect_timeout 10s;
}

location = /api/webhook/inquiry-telegram/test {
    proxy_pass http://127.0.0.1:8793;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Webhook-Secret $http_x_webhook_secret;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 30s;
    proxy_connect_timeout 10s;
}

location = /api/webhook/inquiry-telegram/health {
    proxy_pass http://127.0.0.1:8793;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 10s;
    proxy_connect_timeout 5s;
}

location = /api/webhook/telegram-bot {
    proxy_pass http://127.0.0.1:8793;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
    proxy_read_timeout 30s;
    proxy_connect_timeout 10s;
}
