name: Change Admin Password

# 새 비밀번호는 저장소에 두지 않고 GitHub Secret ADMIN_NEW_PASSWORD 로만 전달
on:
  workflow_dispatch:

jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - name: Update Supabase admin password
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMIN_NEW_PASSWORD: ${{ secrets.ADMIN_NEW_PASSWORD }}
          ADMIN_EMAIL: admin@purplelease.com
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_NEW_PASSWORD:-}" ]; then
            echo "ADMIN_NEW_PASSWORD secret missing"
            exit 1
          fi
          BASE="${SUPABASE_URL%/}"

          USERS=$(curl -sS "${BASE}/auth/v1/admin/users?page=1&per_page=200" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          USER_ID=$(echo "$USERS" | jq -r --arg e "$ADMIN_EMAIL" '.users[] | select(.email == $e) | .id' | head -n 1)
          if [ -z "$USER_ID" ] || [ "$USER_ID" = "null" ]; then
            echo "admin user not found: $ADMIN_EMAIL"
            exit 1
          fi
          echo "admin user id=$USER_ID"

          BODY=$(jq -n --arg p "$ADMIN_NEW_PASSWORD" '{password: $p}')
          CODE=$(curl -sS -o /tmp/update.json -w "%{http_code}" -X PUT "${BASE}/auth/v1/admin/users/${USER_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          echo "update http=$CODE"
          if [ "$CODE" != "200" ]; then
            jq -r '.msg // .message // .error_description // .' /tmp/update.json || true
            exit 1
          fi

          LOGIN=$(jq -n --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_NEW_PASSWORD" '{email: $e, password: $p}')
          VCODE=$(curl -sS -o /tmp/login.json -w "%{http_code}" -X POST "${BASE}/auth/v1/token?grant_type=password" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d "$LOGIN")
          echo "verify login http=$VCODE"
          if [ "$VCODE" != "200" ]; then
            jq -r '.msg // .message // .error_description // .' /tmp/login.json || true
            exit 1
          fi
          echo "ADMIN_PASSWORD_CHANGED_OK"
