name: Run SQL Migration (Pooler)

# 서버→DB 직접 연결(IPv6)이 거부될 때 GitHub runner에서 Supabase 풀러(IPv4)로 실행
on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: "실행할 SQL 파일 (supabase/*.sql)"
        required: true
        default: "supabase/migration-footer-settings.sql"

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Run migration via pooler
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SQL_FILE: ${{ github.event.inputs.sql_file }}
          PROJECT_REF: zliclwgiaqvilnnookyi
        run: |
          set -euo pipefail
          if ! [[ "$SQL_FILE" =~ ^supabase/[A-Za-z0-9._-]+\.sql$ ]] || [ ! -f "$SQL_FILE" ]; then
            echo "invalid sql_file: $SQL_FILE"
            exit 1
          fi
          FOUND=""
          for PREFIX in aws-0 aws-1; do
            for REGION in ap-northeast-2 ap-northeast-1 ap-southeast-1 ap-southeast-2 ap-south-1 us-east-1 us-east-2 us-west-1 us-west-2 eu-central-1 eu-west-1 eu-west-2 ca-central-1 sa-east-1; do
              HOST="${PREFIX}-${REGION}.pooler.supabase.com"
              if ERR=$(psql "host=${HOST} port=5432 dbname=postgres user=postgres.${PROJECT_REF} sslmode=require connect_timeout=5" -tAc "select 1" 2>&1 >/dev/null); then
                FOUND="$HOST"
                break 2
              fi
              echo "[try] ${HOST}: $(echo "$ERR" | tail -n 1 | cut -c1-160)"
            done
          done
          if [ -z "$FOUND" ]; then
            echo "pooler host not found"
            exit 1
          fi
          echo "pooler=$FOUND"
          psql "host=${FOUND} port=5432 dbname=postgres user=postgres.${PROJECT_REF} sslmode=require" \
            -v ON_ERROR_STOP=1 -f "$SQL_FILE"
          echo "MIGRATION_OK $SQL_FILE"
